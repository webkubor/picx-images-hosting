<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bannerBgAura" cx="150" cy="120" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2338" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#091524" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050B14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bannerRightAura" cx="710" cy="130" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2D28" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#071822" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050B14" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardBg" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="50%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>

    <!-- Card Perimeter Stroke -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Brand Text Gradients -->
    <linearGradient id="textCyanEmerald" x1="0" y1="0" x2="270" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="textSilverWhite" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Badge / Pill Gradients -->
    <linearGradient id="pillBg" x1="0" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2932" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0C1F35" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Chip Substrate Gradient for banner icon -->
    <linearGradient id="bIconChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060C16"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="bIconGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="bIconShieldLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182D46"/>
      <stop offset="50%" stop-color="#0E2034"/>
      <stop offset="100%" stop-color="#07101B"/>
    </linearGradient>

    <linearGradient id="bIconShieldRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101F30"/>
      <stop offset="50%" stop-color="#0A1522"/>
      <stop offset="100%" stop-color="#04080F"/>
    </linearGradient>

    <linearGradient id="bIconNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="bOrbitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="bCoreNeonFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bCyanElectric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="bBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bAmberBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Banner Shadow Filter for Light Mode -->
    <filter id="bannerShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ==================== BANNER CONTAINER CARD ==================== -->
  <g filter="url(#bannerShadow)">
    <rect x="2" y="2" width="796" height="236" rx="16" fill="url(#cardBg)"/>
    <!-- Subtle Ambient Radial Glows inside card -->
    <rect x="2" y="2" width="796" height="236" rx="16" fill="url(#bannerBgAura)"/>
    <rect x="2" y="2" width="796" height="236" rx="16" fill="url(#bannerRightAura)"/>
    <!-- Card Border -->
    <rect x="2" y="2" width="796" height="236" rx="16" stroke="url(#cardBorder)" stroke-width="1.25" fill="none"/>
    <rect x="3.5" y="3.5" width="793" height="233" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  </g>

  <!-- ==================== CYBER MATRIX GRID BACKGROUND ==================== -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.75">
    <!-- Horizontal Grid Lines -->
    <line x1="20" y1="40" x2="780" y2="40" stroke-dasharray="2 6"/>
    <line x1="20" y1="80" x2="780" y2="80" stroke-dasharray="2 6"/>
    <line x1="20" y1="120" x2="780" y2="120" stroke-dasharray="2 6"/>
    <line x1="20" y1="160" x2="780" y2="160" stroke-dasharray="2 6"/>
    <line x1="20" y1="200" x2="780" y2="200" stroke-dasharray="2 6"/>
    <!-- Vertical Grid Lines -->
    <line x1="120" y1="20" x2="120" y2="220" stroke-dasharray="2 6"/>
    <line x1="250" y1="20" x2="250" y2="220" stroke-dasharray="2 6"/>
    <line x1="390" y1="20" x2="390" y2="220" stroke-dasharray="2 6"/>
    <line x1="530" y1="20" x2="530" y2="220" stroke-dasharray="2 6"/>
    <line x1="670" y1="20" x2="670" y2="220" stroke-dasharray="2 6"/>
  </g>

  <!-- Corner Precision Reticles / Tech Registration Crosses -->
  <g stroke="#10B981" stroke-width="1.2" opacity="0.45" stroke-linecap="round">
    <!-- Top-Left -->
    <path d="M 18 28 L 18 18 L 28 18"/>
    <!-- Top-Right -->
    <path d="M 782 28 L 782 18 L 772 18"/>
    <!-- Bottom-Left -->
    <path d="M 18 212 L 18 222 L 28 222"/>
    <!-- Bottom-Right -->
    <path d="M 782 212 L 782 222 L 772 222"/>
    <!-- Plus Marks -->
    <path d="M 250 18 L 250 24 M 247 21 L 253 21"/>
    <path d="M 530 18 L 530 24 M 527 21 L 533 21"/>
  </g>

  <!-- ==================== RIGHT SIDE: CYBER PASSPORT CLEARANCE STAMP ==================== -->
  <g transform="translate(688, 120)">
    <!-- Ambient Halo -->
    <circle cx="0" cy="0" r="56" fill="#10B981" fill-opacity="0.04"/>

    <!-- Concentric Guilloche / Encoder Rings -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#22D3EE" stroke-width="1.25" stroke-dasharray="3 4" opacity="0.4"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4"/>

    <!-- 12 Radial Micro-Ticks (Clock / Compass Protocol) -->
    <g stroke="#10B981" stroke-width="1" opacity="0.5">
      <line x1="0" y1="-46" x2="0" y2="-42"/>
      <line x1="0" y1="42" x2="0" y2="46"/>
      <line x1="-46" y1="0" x2="-42" y2="0"/>
      <line x1="42" y1="0" x2="46" y2="0"/>
      <line x1="32.5" y1="-32.5" x2="29.7" y2="-29.7"/>
      <line x1="-32.5" y1="32.5" x2="-29.7" y2="29.7"/>
      <line x1="-32.5" y1="-32.5" x2="-29.7" y2="-29.7"/>
      <line x1="32.5" y1="32.5" x2="29.7" y2="29.7"/>
    </g>

    <!-- Center Security Enclave Glyph -->
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#0C1B2A" stroke="url(#bIconNeon)" stroke-width="1.2" opacity="0.85"/>
    
    <!-- Mini E-Passport Glyph inside stamp -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4.5" fill="#060C16" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="1.5" fill="#22D3EE"/>

    <!-- Passport Clearance Badges -->
    <g transform="translate(0, 64)">
      <rect x="-42" y="0" width="84" height="15" rx="3" fill="#0E232B" stroke="#10B981" stroke-width="0.75" stroke-opacity="0.6"/>
      <text x="0" y="10.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">
        PASSPORT VERIFIED
      </text>
    </g>
    <g transform="translate(0, -68)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="0.8">
        CRC32: 0x7F2A • 100%
      </text>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: THE DEVICE PASSPORT EMBLEM ==================== -->
  <!-- Scaled and positioned in banner viewport: centered around (120, 120) -->
  <g transform="translate(36, 30) scale(0.70)">
    <!-- Ambient Halo -->
    <circle cx="128" cy="128" r="88" fill="url(#bCoreNeonFlare)" opacity="0.65"/>

    <!-- Background Orbit Ring -->
    <g transform="rotate(-28 128 128)">
      <ellipse cx="128" cy="128" rx="88" ry="30" fill="none" stroke="url(#bOrbitGrad)" stroke-width="1.4" stroke-dasharray="3 3 14 4" opacity="0.5"/>
      <circle cx="216" cy="128" r="2.2" fill="#22D3EE" opacity="0.7"/>
    </g>

    <!-- Cryptographic Shield -->
    <path d="M 128 44 L 62 67 L 56 75 L 56 128 C 56 174 88 203 128 217 L 128 44 Z" fill="url(#bIconShieldLeft)"/>
    <path d="M 128 44 L 194 67 L 200 75 L 200 128 C 200 174 168 203 128 217 L 128 44 Z" fill="url(#bIconShieldRight)"/>

    <!-- Shield Perimeter Neon -->
    <path d="M 128 44 L 194 67 L 200 75 L 200 128 C 200 174 168 203 128 217 C 88 203 56 174 56 128 L 56 75 L 62 67 Z" 
          fill="none" stroke="url(#bIconNeon)" stroke-width="2" stroke-linejoin="round" filter="url(#bBloom)"/>

    <!-- Shield Inner Filigree -->
    <path d="M 128 56 L 186 76 L 190 83 L 190 126 C 190 164 162 192 128 205 C 94 192 66 164 66 126 L 66 83 L 70 76 Z" 
          fill="none" stroke="#22D3EE" stroke-width="0.85" stroke-opacity="0.35"/>

    <!-- Foreground Orbit Ring -->
    <g transform="rotate(32 128 128)">
      <ellipse cx="128" cy="128" rx="84" ry="26" fill="none" stroke="url(#bCyanElectric)" stroke-width="1.5" stroke-dasharray="4 4 18 4" opacity="0.75" filter="url(#bBloom)"/>
      <circle cx="212" cy="128" r="4" fill="#F59E0B" filter="url(#bAmberBloom)"/>
      <circle cx="212" cy="128" r="1.75" fill="#FFFBEB"/>
      <circle cx="44" cy="128" r="2.2" fill="#34D399" filter="url(#bBloom)"/>
    </g>

    <!-- Hardware Bus Traces -->
    <g stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M 110 92 L 110 78 L 98 68"/>
      <circle cx="98" cy="68" r="2" fill="#10B981"/>
      <path d="M 146 92 L 146 78 L 158 68"/>
      <circle cx="158" cy="68" r="2" fill="#10B981"/>
    </g>
    <g stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M 110 164 L 110 178 L 98 188"/>
      <circle cx="98" cy="188" r="2" fill="#06B6D4"/>
      <path d="M 128 164 L 128 182"/>
      <circle cx="128" cy="182" r="2.5" fill="#10B981"/>
      <path d="M 146 164 L 146 178 L 158 188"/>
      <circle cx="158" cy="188" r="2" fill="#06B6D4"/>
    </g>
    <g stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
      <path d="M 92 110 L 78 110"/><circle cx="78" cy="110" r="2" fill="#10B981"/>
      <path d="M 92 128 L 70 128"/><circle cx="70" cy="128" r="2.5" fill="#22D3EE"/>
      <path d="M 92 146 L 78 146"/><circle cx="78" cy="146" r="2" fill="#10B981"/>
    </g>
    <g stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
      <path d="M 164 110 L 178 110"/><circle cx="178" cy="110" r="2" fill="#06B6D4"/>
      <path d="M 164 128 L 186 128"/><circle cx="186" cy="128" r="2.5" fill="#10B981"/>
      <path d="M 164 146 L 178 146"/><circle cx="178" cy="146" r="2" fill="#06B6D4"/>
    </g>

    <!-- Secure Silicon Microchip -->
    <rect x="92" y="92" width="72" height="72" rx="14" fill="url(#bIconChip)"/>
    <rect x="92" y="92" width="72" height="72" rx="14" stroke="url(#bCyanElectric)" stroke-width="1.75" fill="none"/>
    <rect x="95.5" y="95.5" width="65" height="65" rx="11" stroke="#334155" stroke-width="0.8" fill="none"/>

    <!-- Microchip Gold Contact Pads -->
    <g fill="none" stroke="url(#bIconGold)" stroke-width="1.75" stroke-linecap="round" opacity="0.95">
      <path d="M 100 106 L 115 106 L 115 116"/>
      <path d="M 156 106 L 141 106 L 141 116"/>
      <path d="M 100 150 L 115 150 L 115 140"/>
      <path d="M 156 150 L 141 150 L 141 140"/>
    </g>

    <!-- Biometric E-Passport Glyph -->
    <line x1="99" y1="128" x2="157" y2="128" stroke="url(#bIconGold)" stroke-width="3" stroke-linecap="round" filter="url(#bBloom)"/>
    <circle cx="128" cy="128" r="14.5" fill="#060C16" stroke="url(#bIconGold)" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="10" fill="none" stroke="#22D3EE" stroke-width="1.25" stroke-dasharray="2.5 2.5"/>
    <circle cx="128" cy="128" r="6" fill="#06B6D4" filter="url(#bBloom)"/>
    <circle cx="128" cy="128" r="2.5" fill="#FFFFFF"/>

    <!-- Biometric Crown Authority Star -->
    <g filter="url(#bAmberBloom)">
      <path d="M 128 60 L 131 66.5 L 137.5 69.5 L 131 72.5 L 128 79 L 125 72.5 L 118.5 69.5 L 125 66.5 Z" fill="#F59E0B"/>
      <circle cx="128" cy="69.5" r="1.5" fill="#FFFBEB"/>
    </g>
  </g>

  <!-- ==================== VERTICAL SEPARATOR / BUS TRACE ==================== -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.8">
    <line x1="228" y1="36" x2="228" y2="204" stroke-dasharray="3 5"/>
    <circle cx="228" cy="36" r="2" fill="#06B6D4" opacity="0.6"/>
    <circle cx="228" cy="204" r="2" fill="#10B981" opacity="0.6"/>
  </g>

  <!-- ==================== RIGHT SIDE: TYPOGRAPHY & BRANDING ==================== -->
  <g transform="translate(250, 36)">
    <!-- Top Pill / Status Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="314" height="24" rx="12" fill="url(#pillBg)"/>
      <rect x="0" y="0" width="314" height="24" rx="12" stroke="url(#pillBorder)" stroke-width="1" fill="none"/>
      
      <!-- Pulsing Emerald Indicator Dot -->
      <circle cx="13" cy="12" r="3.5" fill="#10B981" filter="url(#bBloom)"/>
      <circle cx="13" cy="12" r="1.5" fill="#ECFDF5"/>
      
      <text x="26" y="15.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#67E8F9" letter-spacing="1.2">
        HARDWARE-STICKY • CLIENT-HINTS • GEO-ALIGNED
      </text>
    </g>

    <!-- Brand Main Heading: "device-passport" -->
    <g transform="translate(0, 64)">
      <!-- "device" in crisp white -->
      <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#textSilverWhite)" letter-spacing="-1.2">
        device<tspan fill="#38BDF8" font-weight="300" opacity="0.7">-</tspan><tspan fill="url(#textCyanEmerald)">passport</tspan>
      </text>
      
      <!-- Version Tag (Positioned cleanly right after passport) -->
      <g transform="translate(364, -28)">
        <rect x="0" y="0" width="44" height="18" rx="4" fill="#0E2433" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="22" y="12.5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">v1.0</text>
      </g>
    </g>

    <!-- Subtitle / Positioning Tagline -->
    <text x="0" y="96" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="450" fill="#94A3B8" letter-spacing="-0.2">
      Digital Device Passports for Autonomous Agents &amp; Anti-Bot Stealth
    </text>

    <!-- Three Micro-Feature Badges -->
    <g transform="translate(0, 120)">
      <!-- Badge 1: Sticky Hardware -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="22" rx="6" fill="#0C1929" stroke="#1E293B" stroke-width="1"/>
        <circle cx="10" cy="11" r="2.5" fill="#10B981"/>
        <text x="18" y="14.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.1">
          100% Sticky Hardware
        </text>
      </g>

      <!-- Badge 2: Correlated Hints -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="144" height="22" rx="6" fill="#0C1929" stroke="#1E293B" stroke-width="1"/>
        <circle cx="10" cy="11" r="2.5" fill="#06B6D4"/>
        <text x="18" y="14.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.1">
          Correlated Client-Hints
        </text>
      </g>

      <!-- Badge 3: Geo-Aligned -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="132" height="22" rx="6" fill="#0C1929" stroke="#1E293B" stroke-width="1"/>
        <circle cx="10" cy="11" r="2.5" fill="#F59E0B"/>
        <text x="18" y="14.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.1">
          Geo-Aligned Locales
        </text>
      </g>
    </g>
  </g>
</svg>