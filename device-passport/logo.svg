<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="128" cy="115" r="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111C30"/>
      <stop offset="55%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#03060A"/>
    </radialGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="28%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Shield Facet Left (Specular) -->
    <linearGradient id="shieldFacetLeft" x1="56" y1="46" x2="128" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182D46"/>
      <stop offset="45%" stop-color="#0E2034"/>
      <stop offset="100%" stop-color="#07101B"/>
    </linearGradient>

    <!-- Shield Facet Right (Shadow) -->
    <linearGradient id="shieldFacetRight" x1="128" y1="46" x2="200" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101F30"/>
      <stop offset="45%" stop-color="#0A1522"/>
      <stop offset="100%" stop-color="#04080F"/>
    </linearGradient>

    <!-- Shield Perimeter Laser -->
    <linearGradient id="shieldLaser" x1="56" y1="46" x2="200" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Chip Substrate Body -->
    <linearGradient id="chipSubstrate" x1="92" y1="92" x2="164" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060C16"/>
    </linearGradient>

    <!-- Gold Foil / Smartcard Contact Plates -->
    <linearGradient id="goldPlate" x1="96" y1="96" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanElectric" x1="90" y1="128" x2="166" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Emerald Beam Gradient -->
    <linearGradient id="emeraldBeam" x1="56" y1="128" x2="200" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="30" y1="80" x2="226" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radial Core Flare -->
    <radialGradient id="coreNeonFlare" cx="128" cy="128" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Highlight Diagonal Wash -->
    <linearGradient id="glassReflection" x1="70" y1="46" x2="160" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Badge on Light Mode -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.2"/>
    </filter>

    <!-- Laser Bloom Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Amber Glow -->
    <filter id="amberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== BASE CONTAINER ==================== -->
  <g filter="url(#badgeShadow)">
    <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bgGlow)"/>
    <!-- Outer Laser Perimeter Stroke -->
    <rect x="10" y="10" width="236" height="236" rx="54" stroke="url(#rimGrad)" stroke-width="1.5" fill="none"/>
    <!-- Inner Hairline Reflection -->
    <rect x="11.5" y="11.5" width="233" height="233" rx="52.5" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  </g>

  <!-- ==================== TECH RADAR / COORDINATE GRID ==================== -->
  <g opacity="0.22">
    <!-- Concentric Coordinate Rings -->
    <circle cx="128" cy="128" r="98" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 8"/>
    <circle cx="128" cy="128" r="76" stroke="#10B981" stroke-width="0.75" stroke-dasharray="3 7"/>
    <!-- Axis Ticks -->
    <line x1="128" y1="18" x2="128" y2="34" stroke="#06B6D4" stroke-width="1.2"/>
    <line x1="128" y1="222" x2="128" y2="238" stroke="#06B6D4" stroke-width="1.2"/>
    <line x1="18" y1="128" x2="34" y2="128" stroke="#10B981" stroke-width="1.2"/>
    <line x1="222" y1="128" x2="238" y2="128" stroke="#10B981" stroke-width="1.2"/>
  </g>

  <!-- Precision Corner Reticles -->
  <path d="M 28 42 L 28 28 L 42 28" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 228 42 L 228 28 L 214 28" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 28 214 L 28 228 L 42 228" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 228 214 L 228 228 L 214 228" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- ==================== GLOBAL ORBIT 1 (Deeper Background) ==================== -->
  <g transform="rotate(-28 128 128)">
    <ellipse cx="128" cy="128" rx="88" ry="30" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-dasharray="3 3 14 4" opacity="0.45"/>
    <circle cx="216" cy="128" r="2.2" fill="#22D3EE" opacity="0.7"/>
    <circle cx="40" cy="128" r="1.8" fill="#10B981" opacity="0.6"/>
  </g>

  <!-- ==================== CRYPTOGRAPHIC PASSPORT SHIELD ==================== -->
  <!-- Left Facet (Lighted) -->
  <path d="M 128 44
           L 62 67
           L 56 75
           L 56 128
           C 56 174 88 203 128 217
           L 128 44 Z"
        fill="url(#shieldFacetLeft)"/>

  <!-- Right Facet (Shaded) -->
  <path d="M 128 44
           L 194 67
           L 200 75
           L 200 128
           C 200 174 168 203 128 217
           L 128 44 Z"
        fill="url(#shieldFacetRight)"/>

  <!-- Diagonal Glass Shield Specular Wash -->
  <path d="M 128 44
           L 194 67
           L 182 110
           L 84 200
           C 72 182 56 156 56 128
           L 56 75
           L 62 67 Z"
        fill="url(#glassReflection)"/>

  <!-- Shield Neon Perimeter Armor -->
  <path d="M 128 44
           L 194 67
           L 200 75
           L 200 128
           C 200 174 168 203 128 217
           C 88 203 56 174 56 128
           L 56 75
           L 62 67
           Z"
        fill="none"
        stroke="url(#shieldLaser)"
        stroke-width="1.75"
        stroke-linejoin="round"
        filter="url(#bloom)"/>

  <!-- Shield Inner Filigree Hologram Ring -->
  <path d="M 128 56
           L 186 76
           L 190 83
           L 190 126
           C 190 164 162 192 128 205
           C 94 192 66 164 66 126
           L 66 83
           L 70 76
           Z"
        fill="none"
        stroke="#22D3EE"
        stroke-width="0.75"
        stroke-opacity="0.28"/>

  <!-- ==================== GLOBAL ORBIT 2 (Foreground Crossing Ring) ==================== -->
  <g transform="rotate(32 128 128)">
    <ellipse cx="128" cy="128" rx="84" ry="26" fill="none" stroke="url(#cyanElectric)" stroke-width="1.4" stroke-dasharray="4 4 18 4" opacity="0.65" filter="url(#bloom)"/>
    <!-- Glowing Orbital Satellite / Geo Node -->
    <circle cx="212" cy="128" r="3.5" fill="#F59E0B" filter="url(#amberGlow)"/>
    <circle cx="212" cy="128" r="1.5" fill="#FFFBEB"/>
    <!-- Counter Node -->
    <circle cx="44" cy="128" r="2.2" fill="#34D399" filter="url(#bloom)"/>
    <circle cx="44" cy="128" r="1" fill="#FFFFFF"/>
  </g>

  <!-- ==================== HARDWARE BUS TRACES ==================== -->
  <!-- Top PCB Bus -->
  <g stroke="#34D399" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 110 92 L 110 78 L 98 68"/>
    <circle cx="98" cy="68" r="1.75" fill="#10B981"/>

    <path d="M 146 92 L 146 78 L 158 68"/>
    <circle cx="158" cy="68" r="1.75" fill="#10B981"/>
  </g>

  <!-- Bottom PCB Bus -->
  <g stroke="#22D3EE" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 110 164 L 110 178 L 98 188"/>
    <circle cx="98" cy="188" r="1.75" fill="#06B6D4"/>

    <path d="M 128 164 L 128 182"/>
    <circle cx="128" cy="182" r="2.2" fill="#10B981"/>

    <path d="M 146 164 L 146 178 L 158 188"/>
    <circle cx="158" cy="188" r="1.75" fill="#06B6D4"/>
  </g>

  <!-- Left Bus Pins -->
  <g stroke="#34D399" stroke-width="1.25" stroke-linecap="round" opacity="0.85">
    <path d="M 92 110 L 78 110"/>
    <circle cx="78" cy="110" r="1.75" fill="#10B981"/>

    <path d="M 92 128 L 70 128"/>
    <circle cx="70" cy="128" r="2.2" fill="#22D3EE"/>

    <path d="M 92 146 L 78 146"/>
    <circle cx="78" cy="146" r="1.75" fill="#10B981"/>
  </g>

  <!-- Right Bus Pins -->
  <g stroke="#22D3EE" stroke-width="1.25" stroke-linecap="round" opacity="0.85">
    <path d="M 164 110 L 178 110"/>
    <circle cx="178" cy="110" r="1.8" fill="#06B6D4"/>

    <path d="M 164 128 L 186 128"/>
    <circle cx="186" cy="128" r="2.2" fill="#10B981"/>

    <path d="M 164 146 L 178 146"/>
    <circle cx="178" cy="146" r="1.8" fill="#06B6D4"/>
  </g>

  <!-- ==================== SECURE ENCLAVE HARDWARE CHIP ==================== -->
  <!-- Chip Substrate Base -->
  <rect x="92" y="92" width="72" height="72" rx="14" fill="url(#chipSubstrate)"/>
  <!-- Chip Laser Bevel Border -->
  <rect x="92" y="92" width="72" height="72" rx="14" stroke="url(#cyanElectric)" stroke-width="1.5" fill="none"/>
  <!-- Silicon Wafer Inner Border -->
  <rect x="95.5" y="95.5" width="65" height="65" rx="11" stroke="#334155" stroke-width="0.75" fill="none"/>

  <!-- Core Radiant Neon Aura -->
  <circle cx="128" cy="128" r="32" fill="url(#coreNeonFlare)"/>

  <!-- Precision Silicon Micro-Pads (Smartcard Facets) -->
  <g fill="none" stroke="url(#goldPlate)" stroke-width="1.5" stroke-linecap="round" opacity="0.95">
    <!-- Top-Left Segment -->
    <path d="M 100 106 L 115 106 L 115 116"/>
    <!-- Top-Right Segment -->
    <path d="M 156 106 L 141 106 L 141 116"/>
    <!-- Bottom-Left Segment -->
    <path d="M 100 150 L 115 150 L 115 140"/>
    <!-- Bottom-Right Segment -->
    <path d="M 156 150 L 141 150 L 141 140"/>
  </g>

  <!-- Micro Silicon Trace Details inside chip -->
  <g stroke="#22D3EE" stroke-width="0.75" opacity="0.5">
    <line x1="102" y1="120" x2="110" y2="120"/>
    <line x1="146" y1="120" x2="154" y2="120"/>
    <line x1="102" y1="136" x2="110" y2="136"/>
    <line x1="146" y1="136" x2="154" y2="136"/>
  </g>

  <!-- ==================== BIOMETRIC E-PASSPORT GLYPH ==================== -->
  <!-- Full-Width International E-Passport Horizontal Capsule Ribbon -->
  <g filter="url(#bloom)">
    <line x1="99" y1="128" x2="157" y2="128" stroke="url(#goldPlate)" stroke-width="2.75" stroke-linecap="round"/>
  </g>

  <!-- Central Biometric Iris / Cryptographic Token Seal -->
  <circle cx="128" cy="128" r="14.5" fill="#060C16" stroke="url(#goldPlate)" stroke-width="2.25"/>
  <circle cx="128" cy="128" r="10" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <!-- Glowing Optical Aperture Core -->
  <circle cx="128" cy="128" r="6" fill="#06B6D4" filter="url(#bloom)"/>
  <circle cx="128" cy="128" r="2.5" fill="#FFFFFF"/>

  <!-- ==================== PASSPORT TOP CROWN EMBLEM ==================== -->
  <!-- Golden Biometric Authority Sparkle (4-pointed star) -->
  <g filter="url(#amberGlow)">
    <path d="M 128 60 L 131 66.5 L 137.5 69.5 L 131 72.5 L 128 79 L 125 72.5 L 118.5 69.5 L 125 66.5 Z" fill="#F59E0B"/>
    <circle cx="128" cy="69.5" r="1.5" fill="#FFFBEB"/>
  </g>

  <!-- Mini flanking security authentication pips with bridge lines -->
  <g opacity="0.85">
    <line x1="116" y1="70" x2="123" y2="69.5" stroke="#06B6D4" stroke-width="0.75" opacity="0.5"/>
    <line x1="133" y1="69.5" x2="140" y2="70" stroke="#06B6D4" stroke-width="0.75" opacity="0.5"/>
    <circle cx="114" cy="70" r="1.5" fill="#22D3EE"/>
    <circle cx="142" cy="70" r="1.5" fill="#22D3EE"/>
  </g>

  <!-- ==================== MRZ MACHINE-READABLE ENCRYPTION HASH ==================== -->
  <g fill="#38BDF8" opacity="0.65">
    <rect x="105" y="195" width="2" height="4" rx="0.5"/>
    <rect x="110" y="194" width="1.5" height="5" rx="0.5"/>
    <rect x="114" y="195" width="3" height="4" rx="0.5"/>
    <rect x="120" y="193" width="1.5" height="6" rx="0.5"/>
    <rect x="124" y="194" width="2.5" height="5" rx="0.5"/>
    <rect x="129" y="195" width="1.5" height="4" rx="0.5"/>
    <rect x="133" y="193" width="2.5" height="6" rx="0.5"/>
    <rect x="138" y="195" width="1.5" height="4" rx="0.5"/>
    <rect x="142" y="194" width="2" height="5" rx="0.5"/>
    <rect x="147" y="195" width="2" height="4" rx="0.5"/>
    <rect x="151" y="194" width="1.5" height="5" rx="0.5"/>
  </g>
</svg>
