name: deploy-docs

on:
  push:
    branches: [main]      # 无 paths 过滤：站点会镜像图片目录，任何素材变更都需重新部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs build
      - name: 镜像图片目录到站点（自有域名直出图片）
        run: |
          cd "$GITHUB_WORKSPACE"
          for d in */; do
            d="${d%/}"
            case "$d" in docs|web|tools|node_modules) continue ;; esac
            if find "$d" -type f | grep -qiE '\.(png|jpe?g|webp|gif|svg|bmp|mp4|mov|webm|avif)$'; then
              cp -r "$d" docs/.vitepress/dist/
              echo "  + $d/"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
