<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Bloom 色板：同一色相，只解亮度</title>
<desc id="d">六个 Bloom 莫兰迪原色在深色底上的对比度：Petal 5.7:1 直接可读，Sage 4.7:1 直接可读，Mist 5.9:1 直接可读，Spring 4.1:1 解为 4.5:1，Ripple 5.4:1 直接可读，Stone 5.9:1 直接可读。共 1 个需要调整亮度。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.h1{font-size:38px;font-weight:600;fill:#fef6f9}.h1.b{fill:#ff78be}.chip{font-size:18px;fill:#dcccd3}.sub{font-size:19px;fill:#dcccd3}.nm{font-size:19px;font-weight:600;fill:#fef6f9}.lb{font-size:18px;fill:#dcccd3}.rr{font-size:20px;font-weight:600}.rr.raw{font-weight:500}.sw{opacity:0}.g1{animation:drift 26s cubic-bezier(.45,.05,.55,.95) infinite}.g2{animation:drift2 32s cubic-bezier(.45,.05,.55,.95) infinite}@keyframes drift{0%,100%{transform:translate(0px,0px)}50%{transform:translate(30px,-16px)}}@keyframes drift2{0%,100%{transform:translate(0px,0px)}50%{transform:translate(-26px,12px)}}@keyframes sw{0%,11%{opacity:0;transform:translateX(0px)}13%{opacity:.5;transform:translateX(0px)}28%{opacity:.5;transform:translateX(300px)}31%,100%{opacity:0;transform:translateX(300px)}}@keyframes c0{0%,14%{fill:#e8859b}30%,88%{fill:#e8859b}100%{fill:#e8859b}}@keyframes k0{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.14)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c0{animation:c0 9s cubic-bezier(.2,.8,.2,1) infinite both}.k0{animation:k0 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c1{0%,14%{fill:#8a9a5b}30%,88%{fill:#8a9a5b}100%{fill:#8a9a5b}}@keyframes k1{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.14)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c1{animation:c1 9s cubic-bezier(.2,.8,.2,1) infinite both}.k1{animation:k1 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c2{0%,14%{fill:#92a8b3}30%,88%{fill:#92a8b3}100%{fill:#92a8b3}}@keyframes k2{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.14)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c2{animation:c2 9s cubic-bezier(.2,.8,.2,1) infinite both}.k2{animation:k2 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c3{0%,14%{fill:#a073d7}30%,88%{fill:#a779de}100%{fill:#a073d7}}@keyframes k3{0%,14%{transform:translateX(0px)}30%{transform:translateX(4px)}38%{transform:translateX(-1px)}44%,88%{transform:translateX(0px)}100%{transform:translateX(0px)}}.c3{animation:c3 9s cubic-bezier(.2,.8,.2,1) infinite both}.k3{animation:k3 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c4{0%,14%{fill:#5fa8b2}30%,88%{fill:#5fa8b2}100%{fill:#5fa8b2}}@keyframes k4{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.14)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c4{animation:c4 9s cubic-bezier(.2,.8,.2,1) infinite both}.k4{animation:k4 9s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes c5{0%,14%{fill:#b4a09b}30%,88%{fill:#b4a09b}100%{fill:#b4a09b}}@keyframes k5{0%,26%{transform:translateX(0px) scale(1)}30%{transform:translateX(0px) scale(1.14)}38%,88%{transform:translateX(0px) scale(1)}100%{transform:translateX(0px) scale(1)}}.c5{animation:c5 9s cubic-bezier(.2,.8,.2,1) infinite both}.k5{animation:k5 9s cubic-bezier(.2,.8,.2,1) infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
