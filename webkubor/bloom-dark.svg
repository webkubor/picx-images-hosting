  <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,120,190,0.95)"/><stop offset="1" stop-color="rgba(255,120,190,0.15)"/></linearGradient>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,120,190,0.6)"/><stop offset=".45" stop-color="#514349"/><stop offset="1" stop-color="rgba(81,67,73,0)"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.1" fill="rgba(220,204,211,0.13)"/></pattern>
  <filter id="sd" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>

<g clip-path="url(#pc)">
  <g class="g1"><rect x="-160" y="-160" width="1520" height="740" fill="url(#gh0)"/></g>
  <g class="g2"><rect x="-160" y="-160" width="1520" height="740" fill="url(#gh1)"/></g>
