</g>
<rect x=".5" y=".5" width="1199" height="419" rx="23.5" fill="none" stroke="#514349"/>

<text class="h1" x="56" y="58">原色当字最低 4.1:1</text>
<text class="h1 b" x="56" y="122">只解亮度 → 全部 ≥ 4.5:1</text>
<text class="sub" x="56" y="164">深色底上多数原色本就够读；不到 4.5:1 的，色相与彩度不动，只解亮度</text>
