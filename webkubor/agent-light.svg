<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Agent Eyes：一次 401 从出现到被验证修好</title>
<desc id="d">终端依次出现：dev GET /api/orders 401；eyes 收到证据：请求、响应头、控制台、脱敏后的登录态；agent 读证据定位：本地登录 cookie 过期，代码没问题；eyes 本地 cookie 自修复完成，代码一行没动；dev GET /api/orders 200；agent 用同一请求复验通过，全程没靠猜 ✓。右侧状态球依次显示在看、在想、在修、验证通过；下方时间轴显示这四步的推进。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}.mono,.mono text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace}.st{font-size:20px;font-weight:600;fill:#2a1e22}.p0,.p1,.p2{opacity:0}.p3{opacity:1}.ring{transform-origin:1010px 180px;animation:spin 6s linear infinite,work 16s linear infinite both}.bob{animation:bob 3.2s ease-in-out infinite}.eyes ellipse{transform-box:fill-box;transform-origin:center;animation:blink 4s ease-in-out infinite}.badge{transform-box:fill-box;transform-origin:center;animation:badge 16s ease-out infinite both}.cur{opacity:1;animation:caret 1.05s steps(2,end) infinite}.tl .fill{transform-box:fill-box;transform-origin:left center;animation:fill 16s linear infinite both}.tl .head{transform-box:fill-box;transform-origin:center;animation:head 16s linear infinite both}.tl .seg text{opacity:.75}@keyframes l0{0%{opacity:0}2.5%{opacity:0}4.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.l0{animation:l0 16s linear infinite both}@keyframes l1{0%{opacity:0}12.5%{opacity:0}14.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.l1{animation:l1 16s linear infinite both}@keyframes l2{0%{opacity:0}22.5%{opacity:0}24.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.l2{animation:l2 16s linear infinite both}@keyframes l3{0%{opacity:0}32.5%{opacity:0}34.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.l3{animation:l3 16s linear infinite both}@keyframes l4{0%{opacity:0}42.5%{opacity:0}44.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.l4{animation:l4 16s linear infinite both}@keyframes l5{0%{opacity:0}52.5%{opacity:0}54.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.l5{animation:l5 16s linear infinite both}@keyframes p0{0%{opacity:1}1.9%{opacity:1}22.5%{opacity:1}24.4%{opacity:0}100%{opacity:0}}.p0{animation:p0 16s linear infinite both}@keyframes p1{0%{opacity:0}22.5%{opacity:0}24.4%{opacity:1}32.5%{opacity:1}34.4%{opacity:0}100%{opacity:0}}.p1{animation:p1 16s linear infinite both}@keyframes p2{0%{opacity:0}32.5%{opacity:0}34.4%{opacity:1}52.5%{opacity:1}54.4%{opacity:0}100%{opacity:0}}.p2{animation:p2 16s linear infinite both}@keyframes p3{0%{opacity:0}52.5%{opacity:0}54.4%{opacity:1}92.5%{opacity:1}94.4%{opacity:0}100%{opacity:0}}.p3{animation:p3 16s linear infinite both}@keyframes spin{to{transform:rotate(360deg)}}@keyframes work{0%{opacity:0}22.5%{opacity:0}25%{opacity:1}52.5%{opacity:1}55%{opacity:0}100%{opacity:0}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:.15}}@keyframes fill{0%{transform:scaleX(0)}56.3%{transform:scaleX(1)}100%{transform:scaleX(1)}}@keyframes head{0%{transform:translateX(-724px);opacity:0}3%{opacity:1}56.3%{transform:translateX(0);opacity:1}57.5%{opacity:0}100%{transform:translateX(0);opacity:0}}@keyframes badge{0%{opacity:0;transform:scale(.4)}52.5%{opacity:0;transform:scale(.4)}54.7%{opacity:1;transform:scale(1.12)}56.3%{opacity:1;transform:none}92.5%{opacity:1;transform:none}94.4%{opacity:0;transform:none}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
